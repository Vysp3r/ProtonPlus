name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      distros: ${{ steps.source.outputs.distros }}
      architectures: '["x86_64","aarch64"]'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/package-source
        id: source

  native:
    name: ${{ matrix.distro.name }} (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.source.outputs.distros) }}
        arch: ${{ fromJSON(needs.source.outputs.architectures) }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      TARGET: ${{ matrix.distro.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Source

      - name: Extract packaging action
        shell: bash
        run: |
          tar -xf "ProtonPlus-$VERSION-source.tar.gz" --strip-components=1 \
            "ProtonPlus-$VERSION/.github/actions/package-native"
      - uses: ./.github/actions/package-native

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.source.outputs.architectures) }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Source

      - name: Extract packaging action
        shell: bash
        run: |
          tar -xf "ProtonPlus-$VERSION-source.tar.gz" --strip-components=1 \
            "ProtonPlus-$VERSION/.github/actions/package-appimage"
      - uses: ./.github/actions/package-appimage

  publish:
    if: github.event_name == 'release'
    name: Publish
    needs: [source, native, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: assets
        run: LC_ALL=C sha256sum -- ProtonPlus-* > SHA256SUMS

      - name: Upload assets to the published release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ProtonPlus-* SHA256SUMS --clobber
