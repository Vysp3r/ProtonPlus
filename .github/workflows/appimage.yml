name: Release Packages

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  source:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.archive.outputs.version }}
      architectures: ${{ github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64","aarch64"]' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare tagged source or development snapshot
        id: archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          version=$(./scripts/set-version.sh --print-version)
          if [[ -n $RELEASE_TAG ]]; then
            if ! command -v xmllint >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libxml2-utils
            fi
            ./scripts/set-version.sh "${RELEASE_TAG#v}" --check
          fi
          git archive --format=tar.gz --prefix="ProtonPlus-$version/" \
            --output="ProtonPlus-$version-source.tar.gz" HEAD
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Source
          path: ProtonPlus-${{ steps.archive.outputs.version }}-source.tar.gz
          if-no-files-found: error

  native:
    name: Native (${{ matrix.target }}, ${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        target: [debian13, ubuntu26.04, fedora45, archlinux]
        arch: ${{ fromJSON(needs.source.outputs.architectures) }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Source

      - name: Extract source
        run: |
          tar -xf "ProtonPlus-$VERSION-source.tar.gz"

      - name: Build native package and run Meson tests
        run: |
          test "$(uname -m)" = "$ARCH"
          bash "ProtonPlus-$VERSION/packaging/native-container.sh" build "$TARGET" \
            "ProtonPlus-$VERSION-source.tar.gz" "$PWD/dist"

      - name: Test installation in a fresh container
        run: |
          bash "ProtonPlus-$VERSION/packaging/native-container.sh" test "$TARGET" \
            "ProtonPlus-$VERSION-source.tar.gz" "$PWD/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: Native-${{ env.TARGET }}-${{ env.ARCH }}
          path: dist/ProtonPlus-${{ env.VERSION }}-${{ env.TARGET }}-${{ env.ARCH }}.*
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    if: github.event_name == 'pull_request' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: source
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.source.outputs.architectures) }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    env:
      VERSION: ${{ needs.source.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Source

      - name: Prepare container
        uses: pkgforge-dev/anylinux-setup-action@v1

      - name: Build AppImage
        shell: bash
        run: |
          tar -xf "ProtonPlus-$VERSION-source.tar.gz"
          cd "ProtonPlus-$VERSION"
          /bin/sh packaging/appimage/get-dependencies.sh
          ./scripts/build.sh package appimage
          test -s "dist/ProtonPlus-$VERSION-anylinux-$ARCH.AppImage"
          test -s "dist/ProtonPlus-$VERSION-anylinux-$ARCH.AppImage.zsync"

      - uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: ProtonPlus-${{ env.VERSION }}/dist/ProtonPlus-${{ env.VERSION }}-anylinux-${{ env.ARCH }}.AppImage*
          if-no-files-found: error

  appimage_smoke:
    name: AppImage smoke test (${{ matrix.arch }})
    needs: [source, appimage]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.source.outputs.architectures) }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}

      - name: Check update metadata and launch in a clean container
        shell: bash
        run: |
          appimage="ProtonPlus-$VERSION-anylinux-$ARCH.AppImage"
          grep -aFx "Filename: $appimage" "$appimage.zsync"
          grep -aFx "URL: $appimage" "$appimage.zsync"
          chmod +x "$appimage"
          docker run --rm --network none --volume "$PWD:/artifacts:ro" \
            docker.io/library/debian:13 sh -ec '
              cd "$(mktemp -d)"
              app_id=com.vysp3r.ProtonPlus
              "$1" --appimage-extract >/dev/null
              test -s "squashfs-root/$app_id.desktop"
              test -s squashfs-root/.DirIcon
              test -s "squashfs-root/usr/share/metainfo/$app_id.metainfo.xml"
              grep -aFq "$app_id.State" squashfs-root/share/glib-2.0/schemas/gschemas.compiled
              APPIMAGE_EXTRACT_AND_RUN=1 GSETTINGS_BACKEND=memory "$1" version
            ' sh "/artifacts/$appimage" | grep -Fx "ProtonPlus $VERSION"

  publish:
    if: github.event_name == 'release'
    needs: [source, native, appimage_smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: assets
        run: LC_ALL=C sha256sum -- ProtonPlus-* > SHA256SUMS

      - name: Upload assets to the published release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ProtonPlus-* SHA256SUMS --clobber
