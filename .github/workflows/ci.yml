name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Build scope (Flatpak only or full CI)
        type: choice
        required: true
        default: flatpak
        options:
          - flatpak
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-builds
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak (${{ matrix.variant.arch }})
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # Docker seeds this volume with the preinstalled SDK. Flatpak can then
      # rename SDK directories during updates without hitting overlayfs EXDEV.
      volumes:
        - /var/lib/flatpak
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: protonplus.flatpak
          manifest-path: com.vysp3r.ProtonPlus.local.yml
          run-tests: true
          arch: ${{ matrix.variant.arch }}
          repo-dir: repo
          verbose: true

      - name: Lint release manifest
        continue-on-error: true
        run: flatpak-builder-lint manifest com.vysp3r.ProtonPlus.yml

      - name: Lint local manifest
        continue-on-error: true
        run: flatpak-builder-lint manifest com.vysp3r.ProtonPlus.local.yml

      - name: Lint Flatpak repository
        continue-on-error: true
        run: flatpak-builder-lint repo repo

  source:
    name: Source archive
    if: github.event.deleted != true && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      distros: ${{ steps.source.outputs.distros }}
      architectures: ${{ github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64","aarch64"]' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/package-source
        id: source

  native:
    name: ${{ matrix.distro.name }} (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.source.outputs.distros) }}
        arch: ${{ fromJSON(needs.source.outputs.architectures) }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      TARGET: ${{ matrix.distro.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Source

      - name: Extract packaging action
        shell: bash
        run: |
          tar -xf "ProtonPlus-$VERSION-source.tar.gz" --strip-components=1 \
            "ProtonPlus-$VERSION/.github/actions/package-native"
      - uses: ./.github/actions/package-native

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.source.outputs.architectures) }}
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      volumes:
        # The runner already provides its Docker socket to the job container.
        - /usr/bin/docker:/usr/local/bin/docker:ro
    env:
      VERSION: ${{ needs.source.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Source

      - name: Extract packaging action
        shell: bash
        run: |
          tar -xf "ProtonPlus-$VERSION-source.tar.gz" --strip-components=1 \
            "ProtonPlus-$VERSION/.github/actions/package-appimage"
      - uses: ./.github/actions/package-appimage
