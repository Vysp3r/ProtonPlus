<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ProtonPlus inspired app icon</title>
  <desc id="desc">An original rounded purple app badge with a stylized white P, a proton orbit, and a pink plus symbol.</desc>

  <defs>
    <linearGradient id="tile" x1="78" y1="62" x2="446" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241047"/>
      <stop offset="0.5" stop-color="#650B84"/>
      <stop offset="1" stop-color="#D51A8B"/>
    </linearGradient>

    <radialGradient id="tileGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 92) rotate(44) scale(456)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#160725" stop-opacity="0.22"/>
    </radialGradient>

    <linearGradient id="letter" x1="160" y1="113" x2="265" y2="407" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1E6F8"/>
    </linearGradient>

    <linearGradient id="accent" x1="80" y1="248" x2="430" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB0DA"/>
      <stop offset="0.48" stop-color="#FF55B5"/>
      <stop offset="1" stop-color="#C00B8C"/>
    </linearGradient>

    <filter id="tileShadow" x="8" y="12" width="496" height="506" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#180527" flood-opacity="0.34" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="symbolShadow" x="72" y="82" width="350" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feFlood flood-color="#210631" flood-opacity="0.28" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="chipShadow" x="302" y="281" width="164" height="174" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur"/>
      <feFlood flood-color="#240633" flood-opacity="0.32" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <mask id="pCut" maskUnits="userSpaceOnUse" x="110" y="90" width="310" height="340">
      <rect x="110" y="90" width="310" height="340" fill="#FFFFFF"/>
      <path d="M75 283C146 267 222 260 338 271" fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Transparent canvas; the rounded badge is the icon itself. -->
  <g filter="url(#tileShadow)">
    <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#tile)"/>
    <rect x="38" y="38" width="436" height="436" rx="106" fill="url(#tileGlow)"/>
    <rect x="38" y="38" width="436" height="436" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"/>
  </g>

  <!-- A subtle orbital ring references the “proton” theme. -->
  <ellipse cx="253" cy="254" rx="173" ry="98" transform="rotate(-16 253 254)" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="14"/>
  <circle cx="408" cy="177" r="13" fill="#FFD0E8" fill-opacity="0.92"/>
  <circle cx="408" cy="177" r="5" fill="#FFFFFF" fill-opacity="0.75"/>

  <!-- Original geometric P; the curved stripe cuts through it for motion. -->
  <g filter="url(#symbolShadow)">
    <path
      d="M141 106H286C359 106 403 146 392 210C381 276 330 309 262 309H228L211 409H128L173 135C176 117 166 106 141 106ZM255 168L241 249H273C303 249 326 234 331 206C336 181 321 168 294 168H255Z"
      fill="url(#letter)"
      fill-rule="evenodd"
      clip-rule="evenodd"
      mask="url(#pCut)"/>
  </g>

  <path d="M75 283C146 267 222 260 338 271" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

  <!-- Plus badge keeps the mark readable at small app-icon sizes. -->
  <g filter="url(#chipShadow)">
    <circle cx="384" cy="365" r="64" fill="#FFFFFF" fill-opacity="0.97"/>
    <circle cx="384" cy="365" r="61" fill="none" stroke="#FFFFFF" stroke-opacity="0.58" stroke-width="2"/>
  </g>

  <g fill="url(#accent)">
    <rect x="365" y="321" width="38" height="88" rx="12"/>
    <rect x="340" y="346" width="88" height="38" rx="12"/>
  </g>
</svg>
